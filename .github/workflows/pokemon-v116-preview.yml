name: V116 Pokemon size shiny and recoil - opt-in battle preview
on:
  push:
    branches: [main]
    paths:
      - 'effects/pokemon/**'
      - 'tests/visual-v116.test.cjs'
      - 'tests/browser-visual-v116.cjs'
      - 'index.html'
      - '.github/workflows/pokemon-v116-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pokemon-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests and approved V95 V115 regression
        run: |
          node tests/pokemon-polish-v95.test.cjs
          node tests/pokemon-polish-v115.test.cjs
          node tests/visual-v116.test.cjs
      - name: Prepare required original battle sprite assets
        run: |
          python -m pip install --quiet Pillow
          python tools/build-v107-fighting.py
          python tools/build-v108-fighting.py
          python tools/build-v109-fighting.py
          python tools/build-v110-fighting.py
          python tools/build-v111-poison.py
          python tools/build-v112-poison-preview.py
          python tools/build-v113-poison-preview.py
          python tools/build-v114-ground.py
      - name: Run actual Android-sized battle - normal and safe
        run: node tests/browser-visual-v116.cjs
