name: V117 Kanto Definitivo - cinco frentes em um patch
on:
  push:
    branches: [main]
    paths:
      - 'effects/v117/**'
      - 'effects/moves/raindance-original-v118.js'
      - 'tests/rain-v118.test.cjs'
      - 'tests/patch-v117.test.cjs'
      - 'tests/browser-v117.cjs'
      - 'index.html'
      - '.github/workflows/kanto-v117.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch-v117:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: All-five feature unit tests; protected Pokemon and moves
        run: |
          node tests/pokemon-polish-v95.test.cjs
          node tests/pokemon-polish-v115.test.cjs
          node tests/visual-v116.test.cjs
          node tests/patch-v117.test.cjs
          node tests/rain-v118.test.cjs
      - name: Build already-approved real attack sprites, offline
        run: |
          python -m pip install --quiet Pillow
          python tools/build-v107-fighting.py
          python tools/build-v108-fighting.py
          python tools/build-v109-fighting.py
          python tools/build-v110-fighting.py
          python tools/build-v111-poison.py
          python tools/build-v112-poison-preview.py
          python tools/build-v113-poison-preview.py
          python tools/build-v114-ground.py
      - name: Real Chromium mobile battle, normal and safe
        run: node tests/browser-v117.cjs
