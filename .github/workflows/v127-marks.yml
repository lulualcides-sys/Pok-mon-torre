name: V127 — approved move registry and check marks
on:
  push:
    branches: [main]
    paths:
      - 'effects/v127/**'
      - 'tests/v127-move-marks.test.cjs'
      - 'parts/p008.txt'
      - 'index.html'
      - '.github/workflows/v127-marks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate approved/edited/under test statuses in battle and move editor
        run: |
          node --check effects/v127/approval-marks.js
          node tests/v127-move-marks.test.cjs
      - name: Protect existing gameplay and accepted move visuals
        run: |
          node tests/v126-gameplay-ui.test.cjs
          node tests/v125-pokemart-sprites.test.cjs
          node tests/v124-recall-ai.test.cjs
