name: Publicar Pokémon Torre
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gerar sprites V72 para as batalhas com Pillow
        run: |
          python -m pip install --quiet Pillow cairosvg
          python tools/build-v72-battle.py
          python tools/build-v77-preview.py
          python tools/build-v78-preview.py
          python tools/build-v82-equipped-grass.py
          python tools/build-v83-vine-whip.py
          python tools/build-v84-2-separated-vines.py
          python tools/build-v85-haze.py
          python tools/build-v86-four-reference.py
          python tools/build-v107-fighting.py
          python tools/build-v108-fighting.py
          python tools/build-v109-fighting.py
          python tools/build-v110-fighting.py
          python tools/build-v111-poison.py
          python tools/build-v112-poison-preview.py
          python tools/build-v113-poison-preview.py
          python tools/build-v114-ground.py
          node tests/poison-v111.test.cjs
          node tests/poison-v112-preview.test.cjs
          node tests/poison-v113-preview.test.cjs
          node tests/poison-v114.test.cjs
          node tests/battle-v122.test.cjs
          node tests/rain-v118.test.cjs
          node tests/patch-v117.test.cjs
          node tests/battle-layout-v120.test.cjs
          node tests/fighting-v110.test.cjs
          node tests/fighting-v109.test.cjs
          node tests/fighting-v108.test.cjs
          node tests/test-v86-four-reference.cjs
          node tests/test-v85-haze.cjs
          node tests/test-v84-2-distinct-art.cjs
          node tests/test-v83-four-grass.cjs
          node tests/test-v84-real-grass.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      # The Actions artifacts endpoint can lag behind upload finalization.
      # Pages fails with "Found 0 artifact(s)" until the artifact is discoverable.
      # Wait for EXACTLY one artifact (not zero, not stale duplicates).
      - name: Aguardar pacote aparecer no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..20}; do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.artifacts | length' 2>/dev/null || echo 0)
            if [ "$count" = "1" ]; then
              echo "Pacote de publicação encontrado."
              exit 0
            fi
            echo "Aguardando indexação do pacote (${attempt}/20), encontrados: $count"
            sleep 3
          done
          echo "Falha: o pacote Pages não apareceu de forma única."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
