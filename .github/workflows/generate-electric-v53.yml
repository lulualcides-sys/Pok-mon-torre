name: Gerar animações elétricas cinematográficas V53
on:
  push:
    branches: [feat/electric-v53-video-cinematic]
  workflow_dispatch:
concurrency:
  group: v53-assets-unique-branch
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/electric-v53-video-cinematic
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar renderizador offline
        run: python -m pip install --disable-pip-version-check pillow
      - name: Gerar 56 quadros animados sem CSS ou PNG estático na batalha
        run: python tools/build_electric_v53.py
      - name: Validar imagens e diversidade de frames
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for move in ['faisca','discharge','tempestade-de-raios','trovao']:
              folder=Path('effects/moves')/move
              frames=[folder/'sprites'/f'frame_{n:02}.png' for n in range(1,9)]
              impacts=[folder/'impact'/f'hit_{n:02}.png' for n in range(1,5)]
              assert len({p.read_bytes() for p in frames})==8,move
              for p in frames+impacts:
                  with Image.open(p) as im:
                      assert im.mode=='RGBA' and im.size==(280,320),p
                      a=im.getextrema()[3]
                      assert a[0]==0 and a[1]>15,p
          arcs=[Path('effects/moves/discharge/arcs')/f'arc_{n:02}.png' for n in range(1,9)]
          assert len({p.read_bytes() for p in arcs})==8
          for p in arcs:
              with Image.open(p) as im:
                  assert im.size==(384,144) and im.mode=='RGBA',p
          print('PASS: 32 sprites, 16 impacts e 8 arcos únicos')
          PY
      - name: Publicar arte final somente na branch de teste
        run: |
          git config user.name "Pokemon Torre VFX"
          git config user.email "actions@users.noreply.github.com"
          git add effects/moves/*/sprites/frame_*.png effects/moves/*/impact/hit_*.png effects/moves/discharge/arcs/arc_*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(electric): 56 blue-violet cinematic animation frames"
            git push origin HEAD:feat/electric-v53-video-cinematic
          fi
