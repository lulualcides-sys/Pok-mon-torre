name: Gerar efeitos originais Agua e Gelo V58
on:
  push:
    branches: [main]
    paths:
      - 'tools/build_elemental_v58.py'
      - '.github/workflows/render-elemental-v58.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-elemental-v58
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Validate source code
        run: |
          python -m py_compile tools/build_elemental_v58.py
          node --check effects/moves/catalog/elemental-eight-v58.js
      - name: Render eight unique water/ice animation atlases
        run: python tools/build_elemental_v58.py --effect all
      - name: Check every frame and transparent RGBA art
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          effects=('kraken','ice-crystal','waterball','ice-spike','snowflake','water-drop','water-hurricane','geyser')
          for effect in effects:
              category='ice' if effect in ('ice-crystal','ice-spike','snowflake') else 'water'
              file=Path('effects/elements')/category/effect/'atlas.png'
              with Image.open(file) as image:
                  assert image.mode=='RGBA' and image.size==(1152,144),(effect,image.size)
                  assert image.getextrema()[3][0]==0 and image.getextrema()[3][1]>100,effect
                  frames=[image.crop((i*144,0,(i+1)*144,144)).tobytes() for i in range(8)]
                  assert len(set(frames))==8,effect
                  assert len(set(frames[3]))>9,effect
              print('PASS',effect,'8 frames')
          PY
      - name: Test registered moves and sprite playback
        run: node tests/test-elemental-v58.cjs
      - name: Commit only generated sprite atlases
        run: |
          git config user.name 'Pokémon Torre VFX'
          git config user.email 'actions@users.noreply.github.com'
          git add effects/elements/ice effects/elements/water
          if ! git diff --cached --quiet; then
            git commit -m 'assets(water-ice): eight original cinematic sprite atlases V58'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'All eight atlases are already current'
          fi
