name: V100 — catálogo único PT/EN
on:
  pull_request:
    paths:
      - 'effects/moves/catalog/unify-duplicates-v100.js'
      - 'tests/move-dedup-v100.test.cjs'
      - 'index.html'
      - '.github/workflows/move-dedup-v100.yml'
  push:
    branches: [main]
    paths:
      - 'effects/moves/catalog/unify-duplicates-v100.js'
      - 'tests/move-dedup-v100.test.cjs'
      - 'index.html'
      - '.github/workflows/move-dedup-v100.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dedup-moves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/move-dedup-v100.test.cjs
