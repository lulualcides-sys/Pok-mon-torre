name: Testar golpes de fogo em sprites V41
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste-animacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sprites originais e executar quatro golpes
        run: node tests/test-fire-v41.cjs
