name: Testar golpes Fogo V42 Água V45 Elétrico V46 e tipos reais
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste-animacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar fogo, água, 4 elétricos e tipos corrigidos
        run: |
          node tests/test-fire-v41.cjs
          node tests/test-fire-v42.cjs
          node tests/test-water-v43.cjs
          node tests/test-electric-v46.cjs
