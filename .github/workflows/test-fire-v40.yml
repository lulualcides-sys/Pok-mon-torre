name: Testar golpes em sprites Fogo V42 e Água V45
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste-animacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar fogo V42, água V44 e quatro golpes novos V45
        run: |
          node tests/test-fire-v41.cjs
          node tests/test-fire-v42.cjs
          node tests/test-water-v43.cjs
