name: Testar golpes de fogo V41 e V42
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste-animacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar oito ataques em sprites e efeitos de status
        run: |
          node tests/test-fire-v41.cjs
          node tests/test-fire-v42.cjs
