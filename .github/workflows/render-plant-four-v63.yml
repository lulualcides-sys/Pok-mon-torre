name: Render four approved Grass status sprites V63
on:
  push:
    branches: [main]
    paths:
      - 'tools/build_plant_four_v63.py'
      - 'effects/moves/v63-plant/render.js'
      - 'tests/test-plant-four-v63.cjs'
      - '.github/workflows/render-plant-four-v63.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-plant-v63
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Check syntax
        run: |
          python -m py_compile tools/build_plant_four_v63.py
          node --check effects/moves/v63-plant/render.js
          node --check tests/test-plant-four-v63.cjs
      - name: Generate 32 original animated frames
        run: python tools/build_plant_four_v63.py --move all
      - name: Validate four RGBA atlases and unique phases
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for name in ('stun-spore','po-do-sono','leech-seed','esporos'):
              target=Path('effects/moves/v63-plant')/name/'atlas.png'
              with Image.open(target) as atlas:
                  assert atlas.mode=='RGBA' and atlas.size==(1536,192),name
                  mn,mx=atlas.getextrema()[3]
                  assert mn==0 and mx>=200,(name,mn,mx)
                  frames=[atlas.crop((i*192,0,(i+1)*192,192)).tobytes() for i in range(8)]
                  assert len(set(frames))==8,name
                  assert all(any(f[3::4]) for f in frames),name
              print('PASS',name,': eight unique transparent frames')
          PY
      - name: Test existing status catalog, no old VFX and approved sprite lock
        run: node tests/test-plant-four-v63.cjs
      - name: Commit only new four grass atlases
        run: |
          git config user.name 'Pokémon Torre VFX'
          git config user.email 'actions@users.noreply.github.com'
          for move in stun-spore po-do-sono leech-seed esporos; do
            git add "effects/moves/v63-plant/$move/atlas.png"
          done
          if ! git diff --cached --quiet; then
            git commit -m 'assets(v63): 32 original frames for four approved grass status moves'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'V63 grass atlases already exist and were verified'
          fi
