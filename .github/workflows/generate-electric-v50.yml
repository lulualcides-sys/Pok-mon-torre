name: Gerar sprites finais elétricos V50
on:
  push:
    branches: [feat/electric-v50-frame-assets]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  png-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/electric-v50-frame-assets
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar gerador de imagens
        run: python -m pip install --disable-pip-version-check cairosvg
      - name: Gerar 32 frames e 16 impactos transparentes
        run: python tools/build_electric_v50.py
      - name: Verificar 48 sprites reais antes do commit
        run: |
          python - <<'PY'
          import pathlib, struct, sys
          moves=['faisca','discharge','tempestade-de-raios','trovao']
          for m in moves:
              root=pathlib.Path('effects/moves')/m
              frames=sorted((root/'sprites').glob('frame_*.png'))
              impacts=sorted((root/'impact').glob('hit_*.png'))
              assert len(frames)==8 and len(impacts)==4,(m,len(frames),len(impacts))
              for p in frames+impacts:
                  data=p.read_bytes()
                  assert data[:8]==b'\x89PNG\r\n\x1a\n' and len(data)>600,p
                  w,h=struct.unpack('>II',data[16:24])
                  assert (w,h)==(280,320),p
          print('PASS: 48 PNGs de 280x320, todos com assinatura válida')
          PY
      - name: Salvar os sprites gerados na própria branch
        run: |
          git config user.name "Pokemon Torre Build"
          git config user.email "actions@users.noreply.github.com"
          git add effects/moves/*/sprites/frame_*.png effects/moves/*/impact/hit_*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(electric): 48 finished transparent PNG attack frames V50"
            git push origin HEAD:feat/electric-v50-frame-assets
          fi
