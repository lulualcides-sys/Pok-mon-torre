name: REA - Diagnostico público de desbloqueio dos Pokémon

on:
  workflow_dispatch:
  push:
    branches: [rea-pokearena-all-visible-moves]
    paths:
      - .github/scripts/rea-unlock-conditions-readonly.cjs
      - .github/workflows/rea-readonly-unlock-audit.yml

permissions:
  contents: read

jobs:
  investigar-controles:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar navegador de diagnóstico
        run: |
          npm install --prefix /tmp/rea-unlock-study --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1
          node --check .github/scripts/rea-unlock-conditions-readonly.cjs
      - name: Ler exclusivamente módulos públicos de seleção
        run: |
          node .github/scripts/rea-unlock-conditions-readonly.cjs
      - name: Arquivar condições públicas de desbloqueio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-condicoes-desbloqueio-publicas
          path: rea-unlock-study/
          retention-days: 30
