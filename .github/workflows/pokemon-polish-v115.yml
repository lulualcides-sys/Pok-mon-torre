name: V115 global Pokemon sprite finish (Mewtwo V95 preserved)
on:
  push:
    branches: [main]
    paths:
      - 'effects/pokemon/**'
      - 'tests/pokemon-polish-v115.test.cjs'
      - 'tests/browser-pokemon-v115.cjs'
      - 'index.html'
      - '.github/workflows/pokemon-polish-v115.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-pokemon-appearance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve Mewtwo and verify global species pipeline
        run: |
          node tests/pokemon-polish-v95.test.cjs
          node tests/pokemon-polish-v115.test.cjs
      - name: Bake all existing battle atlases required for real Android browser
        run: |
          python -m pip install --quiet Pillow
          python tools/build-v107-fighting.py
          python tools/build-v108-fighting.py
          python tools/build-v109-fighting.py
          python tools/build-v110-fighting.py
          python tools/build-v111-poison.py
          python tools/build-v112-poison-preview.py
          python tools/build-v113-poison-preview.py
          python tools/build-v114-ground.py
      - name: Visual battle on Android-size Chromium (normal and safe)
        run: node tests/browser-pokemon-v115.cjs
