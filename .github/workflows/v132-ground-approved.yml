name: V132 — Osso 40% e Grande Fissura aprovados
on:
  push:
    branches: [main]
    paths:
      - "effects/moves/v132-ground-approved/**"
      - "effects/moves/STATUS_APROVADOS.json"
      - "effects/v127/**"
      - "tests/v132-ground-approved.test.cjs"
      - "tests/v130-ground-preview.test.cjs"
      - "tests/v127-move-marks.test.cjs"
      - "index.html"
      - ".github/workflows/v132-ground-approved.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approve-two:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Approved-only battle animation with native damage
        run: |
          node tests/v132-ground-approved.test.cjs
          node tests/v131-ground-refinement.test.cjs
          node tests/v130-ground-preview.test.cjs
          node tests/v127-move-marks.test.cjs
          node tests/v128-water-preview.test.cjs
          node tests/v129-ground-catalog.test.cjs
          node tests/v126-gameplay-ui.test.cjs
