name: V110 Fighting — only contact pixel sparks
on:
  push:
    branches: [main]
    paths:
      - 'tools/build-v110-fighting.py'
      - 'effects/moves/v110-fighting/**'
      - 'effects/moves/v107-fighting/real-sprites.js'
      - 'index.html'
      - 'tests/fighting-v110.test.cjs'
      - 'tests/browser-v110-fast.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet Pillow
      - name: Bake only impact frames
        run: |
          python tools/build-v107-fighting.py
          python tools/build-v108-fighting.py
          python tools/build-v109-fighting.py
          python tools/build-v110-fighting.py
      - run: node tests/fighting-v110.test.cjs
      - run: node tests/fighting-v109.test.cjs
      - run: node tests/fighting-v104.test.cjs
      - run: node tests/stadium-arena-v97.test.cjs
      - run: node tests/wide-stadium-v98.test.cjs
      - name: Real Android Chromium six Fighting contacts, normal and safe
        run: node tests/browser-v110-fast.cjs
