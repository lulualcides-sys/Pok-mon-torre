name: V112 Preview four Poison equipped moves
on:
  push:
    branches: [main]
    paths:
      - 'effects/moves/v112-poison-preview/**'
      - 'tools/build-v112-poison-preview.py'
      - 'tests/poison-v112-preview.test.cjs'
      - 'tests/browser-v112-preview.cjs'
      - 'index.html'
      - '.github/workflows/poison-v112-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  poison-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Render all four authentic GBA-source V112 sprite atlases
        run: |
          python tools/build-v107-fighting.py
          python tools/build-v108-fighting.py
          python tools/build-v109-fighting.py
          python tools/build-v110-fighting.py
          python tools/build-v111-poison.py
          python tools/build-v112-poison-preview.py
      - name: Validate pixel art and preserve all V111 approvals
        run: |
          node tests/poison-v111.test.cjs
          node tests/poison-v112-preview.test.cjs
      - name: Browser smoke normal and safe real combat for the V112 preview
        run: node tests/browser-v112-preview.cjs
