name: V131 Osso pequeno e Grande Fissura geológica
on:
  push:
    branches: [main]
    paths:
      - "effects/moves/v131-ground-refinement/**"
      - "effects/moves/v130-ground-preview/runtime.js"
      - "tests/v131-ground-refinement.test.cjs"
      - "index.html"
      - ".github/workflows/v131-ground-refinement.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ground-v131:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated bone scale and Fissure rock geometry
        run: |
          node tests/v131-ground-refinement.test.cjs
          node tests/v130-ground-preview.test.cjs
          node tests/v128-water-preview.test.cjs
          node tests/v127-move-marks.test.cjs
          node tests/v129-ground-catalog.test.cjs
          node tests/v126-gameplay-ui.test.cjs
