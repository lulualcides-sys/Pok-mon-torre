name: V137 Brock -> Misty e golpes Voadores pixel-art
on:
  push:
    branches: [main]
    paths:
      - "effects/v126/gameplay-ui.js"
      - "effects/moves/v136-flying-pixel/runtime.js"
      - "effects/moves/_runtime/pixi-layer.js"
      - "parts/p013.txt"
      - "tests/v126-gameplay-ui.test.cjs"
      - "tests/v136-flying-pixel.test.cjs"
      - "tests/v137-brock-progression.test.cjs"
      - "index.html"
      - ".github/workflows/v137-stage-pixel.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Brock stage stays fixed and saved victory unlocks Misty
        run: |
          node tests/v137-brock-progression.test.cjs
          node tests/v126-gameplay-ui.test.cjs
      - name: Native flying PixiJS with GPU sprites not old Canvas art
        run: |
          node tests/v136-flying-pixel.test.cjs
          node tests/v135-flying-preview.test.cjs
          node tests/v134-ground-performance.test.cjs
          node tests/v132-ground-approved.test.cjs
          node tests/v128-water-preview.test.cjs
          node tests/v127-move-marks.test.cjs
      - name: Verify transparent 12/16-frame real pixel spritesheets
        run: |
          python -m pip install --quiet Pillow
          python tools/build-v136-flying-pixel.py
          python tools/test-v136-flying-art.py
