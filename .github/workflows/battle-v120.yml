name: V120 mobile battle screenshot regression
on:
  push:
    branches: [main]
    paths:
      - 'effects/ui/battle-layout-v120.js'
      - 'tests/battle-layout-v120.test.cjs'
      - 'tests/browser-layout-v120.cjs'
      - 'index.html'
      - '.github/workflows/battle-v120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-battle-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Blaine duplicate, boss phase, save button, combat preservation
        run: |
          node tests/battle-layout-v120.test.cjs
          node tests/pokemon-polish-v95.test.cjs
          node tests/pokemon-polish-v115.test.cjs
          node tests/visual-v116.test.cjs
      - name: Prepare already-approved combat sprites
        run: |
          python -m pip install --quiet Pillow
          python tools/build-v107-fighting.py
          python tools/build-v108-fighting.py
          python tools/build-v109-fighting.py
          python tools/build-v110-fighting.py
          python tools/build-v111-poison.py
          python tools/build-v113-poison-preview.py
          python tools/build-v114-ground.py
      - name: Real Chromium Android viewport 440x940, normal and safe
        run: node tests/browser-layout-v120.cjs
