name: Testar quatro golpes elétricos V48 / V52
on:
  push:
    branches: [main, feat/electric-cinematic-v48-8frames, feat/electric-v50-frame-assets, fix/electric-v51-art-assets-loader, fix/electric-v52-discharge-radial-real]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  electric-v48:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar a lógica e os movimentos antigos
        run: node tests/test-electric-v46.cjs
      - name: Validar 32 PNGs finais, impactos e ausência de traços Canvas
        run: node tests/test-electric-v48.cjs
