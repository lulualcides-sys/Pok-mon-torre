name: Testar quatro golpes elétricos V48
on:
  push:
    branches: [main, feat/electric-cinematic-v48-8frames]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  electric-v48:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar a lógica e os movimentos antigos
        run: node tests/test-electric-v46.cjs
      - name: Validar 32 fases cinematográficas, contorno e renderização
        run: node tests/test-electric-v48.cjs
