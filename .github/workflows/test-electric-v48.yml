name: Testar quatro golpes elétricos V48 / V53
# Full electric regression is reserved for manual checks.
# Normal sprite/metadata edits are covered by moves-fast.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: electric-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  electric-v48:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar a lógica e os movimentos antigos
        run: node tests/test-electric-v46.cjs
      - name: Validar 32 PNGs finais, impactos e ausência de traços Canvas
        run: node tests/test-electric-v48.cjs
