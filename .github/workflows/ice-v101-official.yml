name: V101 consolidated Ice and V100 bilingual names
on:
  pull_request:
    paths:
      - 'effects/moves/v101-ice-official/**'
      - 'effects/moves/aurora-beam/v101-approved/**'
      - 'effects/moves/catalog/impactoglacial/v101-approved/**'
      - 'effects/moves/raio-de-gelo/v101-approved/**'
      - 'effects/ui/move-dedup-v100.js'
      - 'effects/moves/STATUS_APROVADOS.json'
      - 'tests/ice-v101-official.test.cjs'
      - 'tests/ice-four-v99-preview.test.cjs'
      - 'index.html'
      - '.github/workflows/ice-v101-official.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/ice-v101-official.test.cjs
      - run: node tests/ice-four-v99-preview.test.cjs
      - run: node tests/move-dedup-v100.test.cjs
