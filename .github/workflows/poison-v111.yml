name: V111 Four Poison moves and mobile FPS
on:
  push:
    branches: [main]
    paths:
      - 'effects/moves/v111-poison/**'
      - 'effects/moves/v111-performance/**'
      - 'tools/build-v111-poison.py'
      - 'tests/poison-v111.test.cjs'
      - 'tests/browser-v111-fast.cjs'
      - 'index.html'
  pull_request:
    branches: [main]
    paths:
      - 'effects/moves/v111-poison/**'
      - 'effects/moves/v111-performance/**'
      - 'tools/build-v111-poison.py'
      - 'tests/poison-v111.test.cjs'
      - 'tests/browser-v111-fast.cjs'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  poison-and-fps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Bake only four dedicated Poison spritesheets
        run: python tools/build-v111-poison.py
      - name: Test HP timing, image frames and mobile raster/HUD
        run: node tests/poison-v111.test.cjs
      - name: Regression: existing approved stadium and fighting visual effects
        run: |
          node tests/ice-v101-official.test.cjs
          node tests/stadium-arena-v97.test.cjs
          node tests/wide-stadium-v98.test.cjs
          node tests/fighting-v104.test.cjs
          node tests/test-attack-fps-v61.cjs
      - name: Real Android Chromium, safe and normal, all four equipped Poison moves
        run: |
          python tools/build-v107-fighting.py
          python tools/build-v108-fighting.py
          python tools/build-v109-fighting.py
          python tools/build-v110-fighting.py
          node tests/browser-v111-fast.cjs
