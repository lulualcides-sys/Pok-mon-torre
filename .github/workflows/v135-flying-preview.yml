name: V135 Voadores — quatro prévias na batalha
on:
  push:
    branches: [main]
    paths:
      - "effects/moves/v135-flying-preview/**"
      - "tests/v135-flying-preview.test.cjs"
      - "index.html"
      - ".github/workflows/v135-flying-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v135-flying:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar os quatro golpes Voadores sem mexer no que foi aprovado
        run: |
          node tests/v135-flying-preview.test.cjs
          node tests/v134-ground-performance.test.cjs
          node tests/v133-ground-preview.test.cjs
          node tests/v132-ground-approved.test.cjs
          node tests/v128-water-preview.test.cjs
          node tests/v127-move-marks.test.cjs
