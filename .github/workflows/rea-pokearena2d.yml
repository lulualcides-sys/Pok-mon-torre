name: REA - Analise Poké Arena 2D

on:
  workflow_dispatch:
  push:
    branches:
      - rea-pokearena-battle-v2
    paths:
      - .github/workflows/rea-pokearena2d.yml
      - .github/scripts/rea-battle.mjs

permissions:
  contents: read

jobs:
  analisar-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout analysis-only branch
        uses: actions/checkout@v4

      - name: Preparar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar REA e navegador automatizado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rea-report
          node --version | tee rea-report/node-version.txt
          npm install --global rea-agents@latest
          npm install --prefix /tmp/rea-play --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1
          rea doctor --json > rea-report/doctor.json 2> rea-report/doctor.err || true
          google-chrome --version | tee rea-report/chrome-version.txt

      - name: Iniciar Chrome em perfil descartável
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/rea-pokearena-profile \
            --window-size=780,437 'about:blank' > rea-report/chrome.log 2>&1 &
          echo $! > rea-report/chrome.pid
          for i in $(seq 1 50); do
            if curl --silent --fail http://127.0.0.1:9222/json/list > rea-report/chrome-targets-before.json; then break; fi
            sleep 2
          done
          test -s rea-report/chrome-targets-before.json

      - name: Abrir Play e registrar tela seguinte
        shell: bash
        run: |
          set -uo pipefail
          timeout 160s node .github/scripts/rea-battle.mjs \
            > rea-report/navigation.log 2> rea-report/navigation.err
          echo $? > rea-report/navigation.exit
          cat rea-report/navigation.log || true

      - name: Capturar evidencias REA após Play
        shell: bash
        run: |
          set -uo pipefail
          curl --silent --fail http://127.0.0.1:9222/json/list > rea-report/chrome-targets-after.json || true
          TARGET_ID="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('rea-report/chrome-targets-after.json'));const t=x.find(v=>v.type==='page' && (v.url||'').startsWith('https://www.pokearena2d.com/'));process.stdout.write(t?.id||'')")"
          if [ -z "$TARGET_ID" ]; then
            echo 'Target do Poké Arena não disponível após navegação.' > rea-report/status.txt
            exit 0
          fi
          echo 'Target encontrado; capturando recursos após interação com Play.' > rea-report/status.txt
          timeout 120s rea inspect-web-page http://127.0.0.1:9222 "$TARGET_ID" \
            --observation-ms 1000 --include-accessibility-text --json \
            > rea-report/inspect-after-play.json 2> rea-report/inspect-after-play.err
          echo $? > rea-report/inspect-after-play.exit
          timeout 120s rea analyze-web-bundle http://127.0.0.1:9222 "$TARGET_ID" \
            --json > rea-report/bundle-after-play.json 2> rea-report/bundle-after-play.err
          echo $? > rea-report/bundle-after-play.exit
          timeout 60s rea capture-web-screenshot http://127.0.0.1:9222 "$TARGET_ID" \
            --json > rea-report/screenshot-after-play.json 2> rea-report/screenshot-after-play.err
          echo $? > rea-report/screenshot-after-play.exit
          echo 'Inspeção finalizada; conferir navigation-summary.json e capturas.' >> rea-report/status.txt

      - name: Disponibilizar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-pokearena2d-battle-v2
          path: rea-report/
          if-no-files-found: warn
          retention-days: 14
