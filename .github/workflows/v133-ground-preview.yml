name: V133 Quatro golpes Terra — prévia real na batalha
on:
  push:
    branches: [main]
    paths:
      - "effects/moves/v133-ground-preview/**"
      - "tests/v133-ground-preview.test.cjs"
      - "index.html"
      - ".github/workflows/v133-ground-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Four animations and native hit timing
        run: |
          node tests/v133-ground-preview.test.cjs
          node tests/v132-ground-approved.test.cjs
          node tests/v131-ground-refinement.test.cjs
          node tests/v130-ground-preview.test.cjs
          node tests/v127-move-marks.test.cjs
          node tests/v128-water-preview.test.cjs
          node tests/v129-ground-catalog.test.cjs
