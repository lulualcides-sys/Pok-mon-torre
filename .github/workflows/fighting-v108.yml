name: V108 gallery Fighting pixel-art and physical smoke
on:
  push:
    branches: [main]
    paths:
      - 'tools/build-v108-fighting.py'
      - 'effects/moves/v108-fighting/**'
      - 'effects/moves/v107-fighting/real-sprites.js'
      - 'tests/fighting-v108.test.cjs'
      - 'tests/browser-v107-fast.cjs'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Bake pixel animation frames from actual user GBA sprites
        run: |
          python tools/build-v107-fighting.py
          python tools/build-v108-fighting.py
      - run: node tests/fighting-v108.test.cjs
      - run: node tests/fighting-v104.test.cjs
      - run: node tests/fighting-v107.test.cjs
      - name: Real Android Chrome safe and standard Fighting contact
        run: node tests/browser-v107-fast.cjs
