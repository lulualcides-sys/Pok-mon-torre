name: Gerar sprites de apenas um golpe
on:
  workflow_dispatch:
    inputs:
      move:
        description: 'Golpe a reprocessar, sem mexer nos demais'
        type: choice
        required: true
        options: [faisca, discharge, tempestade-de-raios, trovao]
permissions:
  contents: write
concurrency:
  group: render-move-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  move-only:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar renderizador de arte
        run: python -m pip install --disable-pip-version-check pillow
      - name: Renderizar somente o golpe escolhido
        env:
          MOVE: ${{ inputs.move }}
        run: python tools/build_electric_v53.py --move "$MOVE"
      - name: Validar integridade apenas do golpe
        env:
          MOVE: ${{ inputs.move }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image
          m=os.environ["MOVE"]
          root=Path("effects/moves")/m
          frames=[root/"sprites"/f"frame_{i:02}.png" for i in range(1,9)]
          impacts=[root/"impact"/f"hit_{i:02}.png" for i in range(1,5)]
          assert len(set(p.read_bytes() for p in frames))==8
          for p in frames+impacts:
              with Image.open(p) as img:
                  assert img.mode=="RGBA" and img.size==(280,320)
          if m=="discharge":
              arcs=[root/"arcs"/f"arc_{i:02}.png" for i in range(1,9)]
              assert len(set(p.read_bytes() for p in arcs))==8
          print("PASS isolated sprite set:",m)
          PY
      - name: Commitar apenas o golpe escolhido nesta branch
        env:
          MOVE: ${{ inputs.move }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "Pokemon Torre VFX"
          git config user.email "actions@users.noreply.github.com"
          git add "effects/moves/$MOVE/sprites/" "effects/moves/$MOVE/impact/"
          if [ "$MOVE" = "discharge" ]; then git add "effects/moves/$MOVE/arcs/"; fi
          if ! git diff --cached --quiet; then
            git commit -m "assets($MOVE): isolated 8-frame visual update"
            git push origin "HEAD:$BRANCH"
          fi
