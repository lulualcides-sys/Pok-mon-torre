name: V122 real Poison previews + Android layout & cast performance
on:
  push:
    branches: [main]
    paths:
      - 'effects/moves/v122-poison-preview/**'
      - 'effects/ui/battle-proportion-v122.js'
      - 'effects/ui/move-approved-mark-v122.js'
      - 'effects/performance/cast-smooth-v122.js'
      - 'tests/battle-v122.test.cjs'
      - 'tests/browser-v122.cjs'
      - 'index.html'
      - '.github/workflows/battle-v122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  battle-v122:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test approved moves, preview sprites and geometry isolation
        run: |
          node tests/battle-v122.test.cjs
          node tests/pokemon-polish-v95.test.cjs
          node tests/pokemon-polish-v115.test.cjs
          node tests/visual-v116.test.cjs
          node tests/battle-layout-v120.test.cjs
          node tests/enemy-fighting-v121.test.cjs
      - name: Build original approved GBA / Mystery Dungeon sprite atlases
        run: |
          python -m pip install --quiet Pillow
          python tools/build-v107-fighting.py
          python tools/build-v108-fighting.py
          python tools/build-v109-fighting.py
          python tools/build-v110-fighting.py
          python tools/build-v111-poison.py
          python tools/build-v113-poison-preview.py
          python tools/build-v114-ground.py
      - name: Real mobile Chromium battle, 4 effects, portrait + landscape
        run: node tests/browser-v122.cjs
