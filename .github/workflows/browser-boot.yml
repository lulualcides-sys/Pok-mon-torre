name: Verificar abertura real do Pokémon Torre
# Heavy real-browser tests run on demand, or before merging a changed loader.
# Move-only sprite changes use the fast validator instead.
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'parts/**'
      - 'effects/moves/_runtime/**'
      - 'effects/moves/catalog/bundle.js'
      - 'effects/moves/catalog/painter.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar Chrome
        run: |
          which google-chrome || which google-chrome-stable || which chromium
      - name: Abrir jogo no Chrome e verificar tela inicial
        run: node tests/test-browser-boot.cjs
