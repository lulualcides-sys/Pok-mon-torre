name: Verificar abertura real do Pokémon Torre
on:
  push:
    branches: [main, fix/electric-v51-art-assets-loader, fix/electric-v52-discharge-radial-real]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar Chrome
        run: |
          which google-chrome || which google-chrome-stable || which chromium
      - name: Abrir jogo no Chrome e verificar tela inicial
        run: node tests/test-browser-boot.cjs
