name: Verificar abertura real do Pokémon Torre
# Heavy real-browser tests run on demand, or before merging a changed loader.
# Move-only sprite changes use the fast validator instead.
on:
  push:
    branches: [main]
    paths:
      - 'tests/test-browser-boot.cjs'
      - 'effects/moves/_runtime/combat-hit-reliability-v47.js'
      - 'effects/moves/v103-fighting/**'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'parts/**'
      - 'effects/moves/_runtime/**'
      - 'effects/moves/v103-fighting/**'
      - 'effects/moves/catalog/bundle.js'
      - 'effects/moves/catalog/painter.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gerar transparência dos quatro spritesheets V72 antes do Chrome
        run: |
          python -m pip install --quiet Pillow cairosvg
          python tools/build-v72-battle.py
          python tools/build-v77-preview.py
          python tools/build-v78-preview.py
          python tools/build-v82-equipped-grass.py
          python tools/build-v83-vine-whip.py
          python tools/build-v84-2-separated-vines.py
          python tools/build-v85-haze.py
          python tools/build-v86-four-reference.py
          node tests/test-v86-four-reference.cjs
          node tests/test-v85-haze.cjs
          node tests/test-v84-2-distinct-art.cjs
          node tests/test-v83-four-grass.cjs
          node tests/test-v84-real-grass.cjs
      - name: Verificar Chrome
        run: |
          which google-chrome || which google-chrome-stable || which chromium
      - name: Abrir jogo no Chrome e verificar tela inicial
        run: node tests/test-browser-boot.cjs
