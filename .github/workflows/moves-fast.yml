name: Validar somente golpes modificados
on:
  push:
    branches: [main]
    paths:
      - 'effects/moves/**'
      - 'effects/atelier-v70/**'
      - 'tools/build-atelier-v70.py'
      - 'previews/atelier-v70.html'
      - 'index.html'
      - 'tools/check-move-assets.cjs'
  pull_request:
    branches: [main]
    paths:
      - 'effects/moves/**'
      - 'effects/atelier-v70/**'
      - 'tools/build-atelier-v70.py'
      - 'previews/atelier-v70.html'
      - 'index.html'
      - 'tools/check-move-assets.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-moves-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast-moves:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir catalogo e apenas assets dos golpes modificados
        run: node tools/check-move-assets.cjs --changed
      - name: Preservar os quatro sprites aprovados e validar performance de ataque
        run: |
          node tests/test-four-v60.cjs
          node tests/test-attack-fps-v61.cjs
      - name: Validar os 37 golpes V66 sem interceptar os eletricos preservados
        run: node tests/test-heritage37-v66.cjs

      - name: Validar galeria V67 de quatro golpes sem alterar os eletricos protegidos
        run: node tests/test-v67-four.cjs

      - name: Validar quatro golpes baseados em referencias V68 (40 quadros)
        run: node tests/test-v68-four.cjs

      - name: Abrir galeria V68 no Chromium e validar oito quadros renderizados
        run: node tests/test-v68-browser.cjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Gerar spritesheets 8x4 e validar Ateliê V70
        run: |
          python -m pip install --quiet Pillow
          python tools/build-atelier-v70.py
          node tests/test-atelier-v70.cjs
