name: Validar somente golpes modificados
on:
  push:
    branches: [main]
    paths:
      - 'effects/moves/**'
      - 'tests/test-v76-preview.cjs'
      - 'tests/test-v77-preview.cjs'
      - 'tools/build-v77-preview.py'
      - 'tools/build-v78-preview.py'
      - 'tests/test-v78-preview.cjs'
      - 'tests/test-v79-preview.cjs'
      - 'tests/test-v80-impact.cjs'
      - 'tests/test-v81-approved.cjs'
      - 'tools/build-v82-equipped-grass.py'
      - 'tests/test-v82-equipped-grass.cjs'
      - 'tools/build-v83-vine-whip.py'
      - 'tests/test-v83-four-grass.cjs'
      - 'tests/test-v84-real-grass.cjs'
      - 'tools/build-v85-haze.py'
      - 'tools/build-v86-four-reference.py'
      - 'tests/test-v86-four-reference.cjs'
      - 'tests/test-v85-haze.cjs'
      - 'tools/build-v84-2-separated-vines.py'
      - 'tests/test-v84-2-distinct-art.cjs'
      - 'effects/moves/_runtime/impact-sync-v80.js'
      - 'effects/ui/**'
      - 'tools/build-v72-battle.py'
      - 'tests/test-v72-battle.cjs'
      - 'effects/atelier-v70/**'
      - 'effects/atelier-v71/**'
      - 'tools/build-atelier-v70.py'
      - 'previews/atelier-v70.html'
      - 'index.html'
      - 'tools/check-move-assets.cjs'
  pull_request:
    branches: [main]
    paths:
      - 'effects/moves/**'
      - 'tests/test-v76-preview.cjs'
      - 'tools/build-v72-battle.py'
      - 'tests/test-v72-battle.cjs'
      - 'effects/atelier-v70/**'
      - 'effects/atelier-v71/**'
      - 'tools/build-atelier-v70.py'
      - 'previews/atelier-v70.html'
      - 'index.html'
      - 'tools/check-move-assets.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-moves-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast-moves:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir catalogo e apenas assets dos golpes modificados
        run: node tools/check-move-assets.cjs --changed
      - name: Preservar os quatro sprites aprovados e validar performance de ataque
        run: |
          node tests/test-four-v60.cjs
          node tests/test-attack-fps-v61.cjs
      - name: Validar os 37 golpes V66 sem interceptar os eletricos preservados
        run: node tests/test-heritage37-v66.cjs

      - name: Validar galeria V67 de quatro golpes sem alterar os eletricos protegidos
        run: node tests/test-v67-four.cjs

      - name: Validar quatro golpes baseados em referencias V68 (40 quadros)
        run: node tests/test-v68-four.cjs

      - name: Abrir galeria V68 no Chromium e validar oito quadros renderizados
        run: node tests/test-v68-browser.cjs

      - name: Validar as quatro artes cinematograficas aprovadas V71
        run: node tests/test-atelier-v70.cjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Renderizar os 4 spritesheets para batalha e validar V72
        run: |
          python -m pip install --quiet Pillow cairosvg
          python tools/build-v72-battle.py
          python tools/build-v77-preview.py
          python tools/build-v78-preview.py
          python tools/build-v82-equipped-grass.py
          python tools/build-v83-vine-whip.py
          python tools/build-v84-2-separated-vines.py
          python tools/build-v85-haze.py
          python tools/build-v86-four-reference.py
          node tests/test-v86-four-reference.cjs
          node tests/test-v85-haze.cjs
          node tests/test-v84-2-distinct-art.cjs
          node tests/test-v83-four-grass.cjs
          node tests/test-v84-real-grass.cjs
          node tests/test-v82-equipped-grass.cjs
          node tests/test-v78-preview.cjs
          node tests/test-v79-preview.cjs
          node tests/test-v80-impact.cjs
          node tests/test-v81-approved.cjs
          node tests/test-v77-preview.cjs
          node tests/test-v72-battle.cjs

      - name: Validar previa V76 da batalha e golpes sequenciais (sem Atelie)
        run: node tests/test-v76-preview.cjs
