name: V129 Ground — catalogue and type filter regression
on:
  push:
    branches: [main]
    paths:
      - "effects/ui/move-type-filter.js"
      - "tests/v129-ground-catalog.test.cjs"
      - "index.html"
      - ".github/workflows/v129-ground-catalog.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-ground:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ground catalogue and visual filters (no save modifications)
        run: |
          node tests/v129-ground-catalog.test.cjs
          node tests/v128-water-preview.test.cjs
          node tests/v127-move-marks.test.cjs
          node tests/move-dedup-v100.test.cjs
