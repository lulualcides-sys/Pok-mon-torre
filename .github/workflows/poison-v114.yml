name: V114 three approved Poison attacks + ground sludge preview
on:
  push:
    branches: [main]
    paths:
      - 'effects/moves/v114-poison/**'
      - 'effects/moves/STATUS_APROVADOS.json'
      - 'tools/build-v114-ground.py'
      - 'tests/poison-v114.test.cjs'
      - 'tests/browser-v114.cjs'
      - 'index.html'
      - '.github/workflows/poison-v114.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  poison-v114:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Generate approved V113 source sprites and new floor-only mud frames
        run: |
          python tools/build-v107-fighting.py
          python tools/build-v108-fighting.py
          python tools/build-v109-fighting.py
          python tools/build-v110-fighting.py
          python tools/build-v111-poison.py
          python tools/build-v113-poison-preview.py
          python tools/build-v114-ground.py
      - name: Test approval protection, normal/preview separation and frame timing
        run: |
          node tests/poison-v111.test.cjs
          node tests/poison-v113-preview.test.cjs
          node tests/poison-v114.test.cjs
      - name: Real Chromium Android - official and preview - normal and safe
        run: node tests/browser-v114.cjs
