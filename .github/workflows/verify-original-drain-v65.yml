name: Verificar drenos originais V65
on:
  push:
    branches: [main]
    paths:
      - 'parts/p009.txt'
      - 'parts/p010.txt'
      - 'effects/moves/_runtime/real-drain-v65.js'
      - 'tests/test-original-drain-v65.cjs'
      - '.github/workflows/verify-original-drain-v65.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-drain-v65
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe e regras de dreno originais
        run: |
          node --check effects/moves/_runtime/real-drain-v65.js
          node --check tests/test-original-drain-v65.cjs
          node tests/test-original-drain-v65.cjs
          node tests/test-plant-four-v63.cjs
