name: Mewtwo visual polish V95
on:
  pull_request:
    paths:
      - 'effects/pokemon/**'
      - 'tests/pokemon-polish-v95.test.cjs'
      - 'index.html'
      - '.github/workflows/pokemon-polish-v95.yml'
  push:
    branches: [main]
    paths:
      - 'effects/pokemon/**'
      - 'tests/pokemon-polish-v95.test.cjs'
      - 'index.html'
      - '.github/workflows/pokemon-polish-v95.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tests/pokemon-polish-v95.test.cjs
          node tests/pokemon-polish-v115.test.cjs
