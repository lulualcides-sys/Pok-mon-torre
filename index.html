<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#09111e"><title>Pokémon Torre — carregando</title><style>body{background:#09111e;color:#d6fff2;font:600 16px system-ui;min-height:100vh;display:grid;place-items:center;margin:0;text-align:center;padding:20px}.progress{font-size:12px;opacity:.7;margin-top:12px}</style></head><body><main><div>🎮 Carregando Pokémon Torre…</div><div class="progress" id="pt-status">Preparando os sprites e animações.</div></main><script>
(async()=>{const total=25;const paths=Array.from({length:total},(_,i)=>'parts/p'+String(i).padStart(3,'0')+'.txt');let completed=0;const pieces=await Promise.all(paths.map(async path=>{const response=await fetch(path+'?build=sprite-fire-v42-5-water44-2',{cache:'no-store'});if(!response.ok)throw Error('Falha '+response.status+' ao carregar '+path);const txt=await response.text();completed++;document.getElementById('pt-status').textContent='Carregando arquivos: '+completed+'/'+total;return txt}));let game=pieces.join('');if(!game.startsWith('<!doctype html>')&&!game.startsWith('<!DOCTYPE html>'))throw Error('Conteúdo do jogo não encontrado');if(!game.includes('PokemonTorreV3579Diagnostics'))throw Error('Versão do jogo incompleta');const fxFiles=["effects/moves/_runtime/begin.js","effects/moves/psychic/index.js","effects/moves/confusion/index.js","effects/moves/flamethrower/index.js","effects/moves/telekinesis/index.js","effects/moves/_runtime/beam-kit.js","effects/moves/hyper-beam/index.js","effects/moves/aurora-beam/index.js","effects/moves/ice-beam/index.js","effects/moves/solar-beam/index.js","effects/moves/catalog/painter.js","effects/moves/catalog/bundle.js","effects/moves/_runtime/semantic-vfx.js","effects/moves/_runtime/cinematic-vfx.js","effects/moves/tri-attack/index.js","effects/moves/_runtime/pixi-layer.js","effects/ui/move-type-filter.js","effects/moves/_runtime/original-gba-vfx.js","effects/moves/_runtime/fire-original-vfx.js","effects/moves/_runtime/legendary-fire-vfx.js","effects/moves/_runtime/end.js"];let plugin=null;try{const sections=await Promise.all(fxFiles.map(async path=>{const r=await fetch(path+'?build=sprite-fire-v42-5-water44-2',{cache:'no-store'});if(!r.ok)throw Error('Módulo '+path+' ('+r.status+')');return r.text()}));plugin=sections.join('\n');}catch(error){console.warn('Efeitos modulares indisponíveis; usando V35.80',error);plugin=await fetch('effects/mewtwo-4moves-v3580.js',{cache:'no-store'}).then(r=>r.ok?r.text():null).catch(()=>null);}if(plugin){const anchor='\nrender();\n})();\n</scr'+'ipt>';if(game.includes(anchor)&&plugin.includes('PokemonTorreMewtwo4FX'))game=game.replace(anchor,'\n'+plugin+'\n'+anchor);else console.warn('Pacote V35.80 não pôde ser inserido; carregando o jogo original.');}// Sprite-only fire effects V41 + V42.5: 8 isolated original-GIF animations.
const fireSpriteFiles=[
 "effects/moves/_runtime/fire-sprite-kit.js",
 "effects/moves/chamas-de-moltres/index.js",
 "effects/moves/rajada-flamejante/index.js",
 "effects/moves/chama-circular/index.js",
 "effects/moves/garra-de-fogo/index.js",
 "effects/moves/_runtime/fire-sprite-integrate.js"
];
const fireSpriteSections=await Promise.all(fireSpriteFiles.map(async path=>{
 const response=await fetch(path+'?build=sprite-fire-v42-5-water44-2',{cache:'no-store'});
 if(!response.ok)throw Error('Falha ao carregar sprite '+path+' ('+response.status+')');
 return response.text();
}));
const nextFourFireMoves=[
 "effects/moves/fire-blast/index.js",
 "effects/moves/will-o-wisp/index.js",
 "effects/moves/sunny-day/index.js",
 "effects/moves/brasa/index.js"
];
const extraFireSections=await Promise.all(nextFourFireMoves.map(async path=>{
 const response=await fetch(path+'?build=sprite-fire-v42-5-water44-2',{cache:'no-store'});
 if(!response.ok)throw Error('Novo golpe não carregou: '+path+' ('+response.status+')');
 return response.text();
}));
// Keep V41 animations intact; register the new four before loading the single combat bridge.
const fireSpritePlugin=[
 ...fireSpriteSections.slice(0,-1),
 ...extraFireSections,
 fireSpriteSections[fireSpriteSections.length-1]
].join('\n');

if(!fireSpritePlugin.includes('PokemonTorreFireSpriteV41'))throw Error('Sprite pack V41 incompleto');
const fireSpriteAnchor='\nrender();\n})();\n</scr'+'ipt>';
if(!game.includes(fireSpriteAnchor))throw Error('Ponto de inserção dos sprites não encontrado');
game=game.replace(fireSpriteAnchor,'\n'+fireSpritePlugin+'\n'+fireSpriteAnchor);
const waterSpriteFiles=[
 "effects/moves/_runtime/water-sprite-kit.js",
 "effects/moves/skull-bash/index.js",
 "effects/moves/tsunami/index.js",
 "effects/moves/amnesia/index.js",
 "effects/moves/hydro-pump/index.js",
 "effects/moves/_runtime/water-sprite-integrate.js"
];
const waterSpriteSections=await Promise.all(waterSpriteFiles.map(async path=>{
 const response=await fetch(path+'?build=water-sprites-v44-2',{cache:'no-store'});
 if(!response.ok)throw Error('Falha ao carregar ataque de água '+path+' ('+response.status+')');
 return response.text();
}));
const waterSpritePlugin=waterSpriteSections.join('\n');
if(!waterSpritePlugin.includes('PokemonTorreWaterV43'))
 throw Error('Sprite engine de água incompleto');
game=game.replace(fireSpriteAnchor,'\n'+waterSpritePlugin+'\n'+fireSpriteAnchor);

const libraries='<scr'+'ipt src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.3/dist/pixi.min.js"></scr'+'ipt>'+'<scr'+'ipt src="https://cdn.jsdelivr.net/npm/@pixi/particle-emitter@5.0.10/dist/particle-emitter.min.js"></scr'+'ipt>';game=game.replace('<script>',libraries+'<script>');document.open();document.write(game);document.close()})().catch(e=>{document.body.innerHTML='<main><h2>Não foi possível abrir o jogo</h2><p id="reason"></p><button onclick="location.reload()">Tentar novamente</button></main>';document.getElementById('reason').textContent=e.message;console.error(e)})
</script></body></html>
