<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#09111e"><title>Pokémon Torre — carregando</title><style>body{background:#09111e;color:#d6fff2;font:600 16px system-ui;min-height:100vh;display:grid;place-items:center;margin:0;text-align:center;padding:20px}.progress{font-size:12px;opacity:.7;margin-top:12px}</style></head><body><main><div>🎮 Carregando Pokémon Torre…</div><div class="progress" id="pt-status">Preparando os sprites e animações.</div></main><script>
(async()=>{const total=25;const paths=Array.from({length:total},(_,i)=>'parts/p'+String(i).padStart(3,'0')+'.txt');let completed=0;const pieces=await Promise.all(paths.map(async path=>{const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw Error('Falha '+response.status+' ao carregar '+path);const txt=await response.text();completed++;document.getElementById('pt-status').textContent='Carregando arquivos: '+completed+'/'+total;return txt}));const game=pieces.join('');if(!game.startsWith('<!doctype html>')&&!game.startsWith('<!DOCTYPE html>'))throw Error('Conteúdo do jogo não encontrado');if(!game.includes('PokemonTorreV3579Diagnostics'))throw Error('Versão do jogo incompleta');document.open();document.write(game);document.close()})().catch(e=>{document.body.innerHTML='<main><h2>Não foi possível abrir o jogo</h2><p id="reason"></p><button onclick="location.reload()">Tentar novamente</button></main>';document.getElementById('reason').textContent=e.message;console.error(e)})
</script></body></html>
